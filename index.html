<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Electricity</title>

    <!-- المظهر قبل أي رسم، عشان ما يحصلش وميض أبيض في الدارك مود -->
    <script>
        (function () {
            var t = 'system';
            try { t = localStorage.getItem('theme') || 'system'; } catch (e) {}
            var dark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (dark) document.documentElement.classList.add('dark');
        })();
    </script>

    <!-- الخط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">

    <!-- المكتبات الخارجية -->
    <script src="https://cdn.tailwindcss.com"></script>                                  <!-- لسه بتخدم الشاشات القديمة -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- التنسيقات: الترتيب مهم -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/sheet.css">
    <link rel="stylesheet" href="css/legacy-dark.css">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-2 sm:p-4 flex items-center justify-center relative overflow-x-hidden">

    <!-- القائمة الجانبية -->
    <div id="sidebarOverlay" data-action="toggleSidebar" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity opacity-0 duration-300"></div>
    <aside id="sideMenu" class="fixed top-0 right-0 h-full w-72 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-4 border-b border-gray-100 flex items-center justify-between bg-gray-50">
            <h3 class="font-bold text-gray-800 text-base">القائمة الرئيسية</h3>
            <button type="button" data-action="toggleSidebar" aria-label="إغلاق القائمة" class="p-2 text-gray-500 hover:text-red-500 rounded-xl transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="sidebarContent" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
    </aside>

    <!-- البطاقة الرئيسية -->
    <main class="bg-white w-full h-[96vh] sm:h-[94vh] rounded-3xl shadow-2xl p-4 sm:p-8 flex flex-col justify-between transition-all duration-300 overflow-hidden">
        <div id="appContainer" class="flex-1 flex flex-col overflow-hidden"></div>
    </main>

    <!-- core: الأساس (لازم الأول) -->
    <script src="js/core/config.js"></script>
    <script src="js/core/state.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/core/actions.js"></script>

    <!-- ui: مكونات الواجهة -->
    <script src="js/ui/icons.js"></script>
    <script src="js/ui/toast.js"></script>
    <script src="js/ui/components.js"></script>
    <script src="js/ui/layout.js"></script>
    <script src="js/ui/sheet-core.js"></script>
    <script src="js/ui/sheet-factory.js"></script>

    <!-- features: الميزات (كل مجلد مسؤول عن حاجة واحدة) -->
    <script src="js/features/auth/auth.js"></script>
    <script src="js/features/dashboard/dashboard.js"></script>
    <script src="js/features/data-center/sheets.js"></script>
    <script src="js/features/data-center/menu.js"></script>
    <script src="js/features/data-center/users.js"></script>
    <script src="js/features/settings/general-settings.js"></script>
    <script src="js/features/seller/my-products.js"></script>
    <script src="js/features/operations/operation-center.js"></script>
    <script src="js/features/profile/profile.js"></script>

    <!-- router بعد الـfeatures، وبعدين نقطة البداية -->
    <script src="js/core/router.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
